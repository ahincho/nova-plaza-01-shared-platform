# Plaza en local: las bases de los servicios, Vault con sus secretos cargados, Keycloak y la mensajería.
# Los servicios corren en la máquina, fuera de Docker, así que las direcciones que guarda Vault
# apuntan a localhost. Los valores por defecto son solo para esta máquina.
name: plaza

services:
  # La base de pedidos guarda el outbox, y Debezium lo lee del log (ADR-048): por eso wal_level=logical.
  # Un slot detenido retiene log; max_slot_wal_keep_size le pone techo.
  orders-db:
    image: postgres:17-alpine
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_slot_wal_keep_size=1GB"]
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: ${ORDERS_DB_USERNAME:-orders}
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:-orders-local}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d orders"]
      interval: 2s
      retries: 30

  catalog-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: ${CATALOG_DB_USERNAME:-catalog}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog-local}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d catalog"]
      interval: 2s
      retries: 30

  payments-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: ${PAYMENTS_DB_USERNAME:-payments}
      POSTGRES_PASSWORD: ${PAYMENTS_DB_PASSWORD:-payments-local}
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d payments"]
      interval: 2s
      retries: 30

  # Keycloak emite el token con el que el cliente llama al BFF (ADR-043). Importa el realm plaza al
  # arrancar, con el cliente público de la demo y dos clientes de prueba. Escucha en el 8180: el 8080
  # es del BFF. El emisor de los tokens es http://localhost:8180/realms/plaza.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-local}
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/plaza-realm.json:/opt/keycloak/data/import/plaza-realm.json:ro
    # La imagen no trae curl: la sonda de disponibilidad se pide por el puerto de gestión con bash.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      retries: 60
      start_period: 20s

  # MongoDB guarda la auditoría de los eventos de pedidos (ADR-048).
  audit-db:
    image: mongo:8.0.32
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${AUDIT_DB_USERNAME:-audit}
      MONGO_INITDB_ROOT_PASSWORD: ${AUDIT_DB_PASSWORD:-audit-local}
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      retries: 30

  # Kafka en KRaft, de un nodo. Los servicios lo ven en localhost:9092, y Kafka Connect en kafka:19092.
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null"]
      interval: 5s
      retries: 30
      start_period: 10s

  # Kafka Connect con Debezium publica el outbox de pedidos (ADR-048). Al arrancar crea el tópico
  # plaza.orders, con tres particiones, y registra el conector de debezium/orders-outbox.json. La
  # credencial de la base llega por variables de entorno, nunca escrita en el JSON. Su API escucha en
  # el 8084: el 8083 es de pagos.
  connect:
    image: quay.io/debezium/connect:3.7.0.Final
    depends_on:
      kafka:
        condition: service_healthy
      orders-db:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: plaza-connect
      CONFIG_STORAGE_TOPIC: plaza_connect_configs
      OFFSET_STORAGE_TOPIC: plaza_connect_offsets
      STATUS_STORAGE_TOPIC: plaza_connect_statuses
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      HEAP_OPTS: -Xms256m -Xmx512m
      ORDERS_DB_USERNAME: ${ORDERS_DB_USERNAME:-orders}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:-orders-local}
    ports:
      - "8084:8083"
    volumes:
      - ./debezium:/plaza:ro
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        /docker-entrypoint.sh start &
        until curl -sf localhost:8083/connectors > /dev/null; do sleep 2; done
        /kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic plaza.orders --partitions 3 --replication-factor 1
        curl -sf -X PUT -H 'Content-Type: application/json' --data @/plaza/orders-outbox.json localhost:8083/connectors/orders-outbox/config > /dev/null
        touch /tmp/registered
        wait
    # Sano cuando el conector y su tarea corren. Una tarea en FAILED es la salida bloqueada (ADR-048).
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/registered && test $$(curl -sf localhost:8083/connectors/orders-outbox/status | grep -o '\"state\":\"RUNNING\"' | wc -l) -eq 2"]
      interval: 3s
      retries: 60
      start_period: 20s

  # Vault en modo dev, que arranca vacío en cada inicio. Al levantar carga un secreto por
  # servicio, con todas sus claves juntas, como lo guardaría operaciones, y recién ahí queda sano.
  vault:
    image: hashicorp/vault:2.1.1
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-plaza-local-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-plaza-local-root}
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        vault server -dev &
        until vault status > /dev/null 2>&1; do sleep 1; done
        vault kv put secret/plaza/orders/db           DB_URL=jdbc:postgresql://localhost:5433/orders           DB_USERNAME=${ORDERS_DB_USERNAME:-orders}           DB_PASSWORD=${ORDERS_DB_PASSWORD:-orders-local}
        vault kv put secret/plaza/catalog/db           DB_URL=jdbc:postgresql://localhost:5434/catalog           DB_USERNAME=${CATALOG_DB_USERNAME:-catalog}           DB_PASSWORD=${CATALOG_DB_PASSWORD:-catalog-local}
        # Pagos es NestJS: su URL es la de Node, no la de JDBC.
        vault kv put secret/plaza/payments/db           DB_URL=postgres://localhost:5435/payments           DB_USERNAME=${PAYMENTS_DB_USERNAME:-payments}           DB_PASSWORD=${PAYMENTS_DB_PASSWORD:-payments-local}
        vault kv put secret/plaza/audit/mongo           MONGODB_URI="mongodb://${AUDIT_DB_USERNAME:-audit}:${AUDIT_DB_PASSWORD:-audit-local}@localhost:27017/audit?authSource=admin"
        touch /tmp/seeded
        wait
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/seeded"]
      interval: 2s
      retries: 30
